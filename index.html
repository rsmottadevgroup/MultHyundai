<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hyundai — Central Multimídia</title>
<meta name="theme-color" content="#040810">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg-0:#03050a;
  --bg-1:#070d18;
  --panel:rgba(14,22,38,.62);
  --panel-solid:#0b1220;
  --border:rgba(120,170,255,.16);
  --border-strong:rgba(110,180,255,.34);
  --blue:#2d8cff;
  --blue-electric:#39d0ff;
  --blue-glow:rgba(57,208,255,.55);
  --ink:#eaf2ff;
  --ink-dim:#8ea3c4;
  --ink-faint:#516b8a;
  --danger:#ff5d6c;
  --ok:#3ef2a8;
  --radius:18px;
  --radius-sm:12px;
  font-size:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  height:100%; margin:0; overscroll-behavior:none;
}
body{
  background:radial-gradient(ellipse at 50% -10%, #0d1b30 0%, var(--bg-0) 55%);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}
#app{
  position:fixed; inset:0; display:flex; flex-direction:column;
}

/* ===== TRACK (map + music side by side, slid via transform) ===== */
#track{
  position:relative; flex:1; min-height:0; display:flex; width:200%;
  transition:transform .38s cubic-bezier(.65,0,.35,1);
  will-change:transform;
}
#track.on-music{ transform:translateX(-50%); }
.screen{ position:relative; width:50%; height:100%; flex-shrink:0; overflow:hidden; }

/* ===== MAP SCREEN ===== */
#map{ position:absolute; inset:0; background:#0a1220; filter:saturate(1.05); }
.leaflet-container{ background:#0a1220; font-family:'Inter',sans-serif; }
.leaflet-control-attribution{
  background:rgba(4,8,14,.55) !important; color:var(--ink-faint) !important;
  font-size:9px !important; backdrop-filter:blur(4px); border-radius:6px 0 0 0;
}
.leaflet-control-attribution a{ color:var(--ink-dim) !important; }

.hud-top{
  position:absolute; top:0; left:0; right:0; z-index:500;
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 14px 0 14px;
  pointer-events:none;
}
.chip{
  pointer-events:auto;
  background:var(--panel); backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid var(--border); border-radius:999px;
  padding:6px 12px; display:flex; align-items:center; gap:7px;
  font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:.04em;
  font-size:13px; color:var(--ink-dim);
  box-shadow:0 4px 18px rgba(0,0,0,.35);
}
.gps-dot{
  width:7px; height:7px; border-radius:50%; background:var(--ink-faint);
  box-shadow:0 0 0 rgba(0,0,0,0); transition:all .3s;
}
.gps-dot.wait{ background:#e8b93a; box-shadow:0 0 8px #e8b93a; animation:pulseDot 1.1s infinite; }
.gps-dot.ok{ background:var(--ok); box-shadow:0 0 8px var(--ok); }
.gps-dot.err{ background:var(--danger); box-shadow:0 0 8px var(--danger); }
@keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

.speed-panel{
  pointer-events:auto;
  background:var(--panel); backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  padding:6px 16px 7px; text-align:center; min-width:92px;
  box-shadow:0 4px 22px rgba(0,0,0,.4), inset 0 0 18px rgba(57,208,255,.06);
}
.speed-value{
  font-family:'Rajdhani',sans-serif; font-weight:700; font-size:30px; line-height:1;
  color:var(--ink); text-shadow:0 0 14px var(--blue-glow);
  font-variant-numeric:tabular-nums;
}
.speed-unit{ font-size:10px; letter-spacing:.14em; color:var(--ink-dim); font-weight:600; }

.hud-banner{
  position:absolute; top:64px; left:50%; transform:translateX(-50%) translateY(-8px);
  z-index:600; pointer-events:none; opacity:0; transition:all .3s;
  background:rgba(20,10,10,.7); backdrop-filter:blur(10px);
  border:1px solid rgba(255,93,108,.4); color:#ffd7da;
  font-family:'Rajdhani',sans-serif; font-weight:600; font-size:12.5px; letter-spacing:.05em;
  padding:6px 14px; border-radius:999px; white-space:nowrap;
}
.hud-banner.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* vehicle marker */
.vehicle-marker{ position:relative; width:46px; height:46px; }
.vehicle-pulse{
  position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle, rgba(57,208,255,.35) 0%, rgba(57,208,255,0) 70%);
  animation:vpulse 2.2s ease-out infinite;
}
@keyframes vpulse{ 0%{ transform:scale(.5); opacity:.8;} 100%{ transform:scale(1.9); opacity:0;} }
.vehicle-arrow-wrap{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  transition:transform .28s linear;
}
.vehicle-arrow-wrap svg{ filter:drop-shadow(0 0 6px rgba(57,208,255,.85)) drop-shadow(0 2px 3px rgba(0,0,0,.6)); }

.map-fabs{
  position:absolute; right:12px; bottom:96px; z-index:500;
  display:flex; flex-direction:column; gap:10px; align-items:center;
}
.fab{
  pointer-events:auto;
  width:46px; height:46px; border-radius:50%;
  background:var(--panel); backdrop-filter:blur(14px);
  border:1px solid var(--border); color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-size:19px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.4);
  transition:transform .12s, border-color .2s, background .2s;
}
.fab:active{ transform:scale(.9); background:rgba(30,50,80,.7); }
.fab.zoom{ font-family:'Rajdhani',sans-serif; font-size:22px; }
.fab-divider{ width:22px; height:1px; background:var(--border); margin:-3px 0; }

.recenter-fab{
  position:absolute; left:12px; bottom:96px; z-index:500;
  pointer-events:auto;
  width:46px; height:46px; border-radius:50%;
  background:var(--panel); backdrop-filter:blur(14px);
  border:1px solid var(--border); color:var(--ink-dim);
  display:flex; align-items:center; justify-content:center; font-size:19px;
  box-shadow:0 4px 16px rgba(0,0,0,.4); transition:all .2s;
}
.recenter-fab.following{
  color:var(--blue-electric); border-color:var(--border-strong);
  box-shadow:0 4px 16px rgba(0,0,0,.4), 0 0 14px rgba(57,208,255,.35);
}
.recenter-fab:active{ transform:scale(.9); }

/* ===== MUSIC SCREEN ===== */
#music{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:22px 26px 10px; gap:16px;
  background:radial-gradient(ellipse at 50% 0%, #0e1c33 0%, var(--bg-0) 70%);
}
.cover-wrap{
  width:min(46vw, 190px); aspect-ratio:1/1; border-radius:20px; position:relative;
  box-shadow:0 20px 50px rgba(0,0,0,.55), 0 0 0 1px var(--border);
  overflow:hidden; transition:box-shadow .4s;
}
.cover-wrap.playing{ box-shadow:0 20px 50px rgba(0,0,0,.55), 0 0 0 1px var(--border-strong), 0 0 34px rgba(57,208,255,.25); }
.cover-art{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.cover-art svg{ width:44%; height:44%; opacity:.9; }

.track-meta{ text-align:center; max-width:86vw; }
.track-title{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; letter-spacing:.01em; }
.track-artist{ color:var(--ink-dim); font-size:14px; margin-top:2px; }
.track-album{ color:var(--ink-faint); font-size:11.5px; margin-top:4px; letter-spacing:.03em; }

.progress-row{ width:100%; max-width:340px; display:flex; align-items:center; gap:9px; }
.time{ font-family:'Rajdhani',sans-serif; font-size:12px; color:var(--ink-dim); width:34px; font-variant-numeric:tabular-nums; }
.time.end{ text-align:right; }
.progress-track{ position:relative; flex:1; height:22px; display:flex; align-items:center; }
.progress-bg{ position:absolute; left:0; right:0; height:4px; border-radius:4px; background:rgba(255,255,255,.12); }
.progress-fill{ position:absolute; left:0; height:4px; border-radius:4px; background:linear-gradient(90deg,var(--blue),var(--blue-electric)); box-shadow:0 0 8px var(--blue-glow); width:0%; }
.progress-input{
  -webkit-appearance:none; appearance:none; width:100%; height:22px; background:transparent; position:relative; z-index:2; margin:0;
}
.progress-input::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px; height:15px; border-radius:50%;
  background:#fff; box-shadow:0 0 0 3px rgba(57,208,255,.35), 0 2px 4px rgba(0,0,0,.5); margin-top:0;
}
.progress-input::-moz-range-thumb{ width:15px; height:15px; border-radius:50%; background:#fff; border:none; box-shadow:0 0 0 3px rgba(57,208,255,.35); }
.progress-input::-moz-range-track{ background:transparent; }

.controls-row{ display:flex; align-items:center; justify-content:center; gap:26px; margin-top:2px; }
.ctrl-btn{
  background:none; border:none; color:var(--ink); display:flex; align-items:center; justify-content:center;
  width:48px; height:48px; border-radius:50%; transition:transform .12s, background .15s;
}
.ctrl-btn:active{ transform:scale(.88); background:rgba(255,255,255,.06); }
.ctrl-btn svg{ width:22px; height:22px; }
.play-btn{
  width:64px; height:64px; background:linear-gradient(160deg,var(--blue),var(--blue-electric));
  box-shadow:0 6px 22px rgba(45,140,255,.45), 0 0 0 1px rgba(255,255,255,.08) inset;
}
.play-btn svg{ width:26px; height:26px; }
.play-btn:active{ transform:scale(.9); }

.mode-tag{
  font-family:'Rajdhani',sans-serif; font-size:10.5px; letter-spacing:.14em; font-weight:600;
  color:var(--ink-faint); border:1px solid var(--border); padding:4px 10px; border-radius:999px;
  background:var(--panel); margin-top:2px;
}

/* ===== BOTTOM NAV ===== */
#nav{
  position:relative; z-index:800; display:flex; gap:8px;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg, rgba(3,6,12,.96) 60%, rgba(3,6,12,.75));
  border-top:1px solid var(--border);
  backdrop-filter:blur(18px);
}
.nav-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 0; border-radius:14px; background:transparent; border:1px solid transparent;
  color:var(--ink-dim); font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14.5px; letter-spacing:.03em;
  transition:all .2s;
}
.nav-btn svg{ width:18px; height:18px; opacity:.75; transition:opacity .2s; }
.nav-btn.active{
  color:var(--ink); background:rgba(45,140,255,.14); border-color:var(--border-strong);
  box-shadow:0 0 16px rgba(57,208,255,.15) inset;
}
.nav-btn.active svg{ opacity:1; filter:drop-shadow(0 0 4px rgba(57,208,255,.7)); }
.nav-btn:active{ transform:scale(.96); }

/* ===== LANDSCAPE (car head-unit orientation) ===== */
@media (orientation:landscape) and (max-height:520px){
  #app{ flex-direction:row; }
  #nav{
    flex-direction:column; width:82px; padding:calc(10px + env(safe-area-inset-top)) 6px calc(10px + env(safe-area-inset-bottom));
    border-top:none; border-left:1px solid var(--border); order:2;
  }
  .nav-btn{ flex-direction:column; gap:4px; font-size:11px; padding:12px 0; }
  #track{ order:1; }
  .music-inner-land{ flex-direction:row; }
  #music{ flex-direction:row; justify-content:center; gap:34px; padding:14px 30px; }
  .cover-wrap{ width:min(30vh, 170px); flex-shrink:0; }
  .music-right{ display:flex; flex-direction:column; align-items:center; gap:14px; max-width:360px; width:100%; }
  .hud-top{ padding-top:calc(8px + env(safe-area-inset-top)); }
}
@media (min-width:0px){ .music-right{ display:contents; } }
@media (orientation:landscape) and (max-height:520px){
  .music-right{ display:flex; }
}

/* Small phones */
@media (max-width:340px){
  .speed-value{ font-size:25px; }
  .track-title{ font-size:19px; }
}

.hidden{ display:none !important; }
</style>
</head>
<body>

<div id="app">
  <div id="track">

    <!-- ============ MAP SCREEN ============ -->
    <section class="screen" id="map-screen">
      <div id="map"></div>

      <div class="hud-top">
        <div class="chip" id="gpsChip">
          <span class="gps-dot wait" id="gpsDot"></span>
          <span id="gpsText">AGUARDANDO GPS...</span>
        </div>
        <div class="speed-panel">
          <div class="speed-value" id="speedValue">0</div>
          <div class="speed-unit">KM/H</div>
        </div>
      </div>

      <div class="hud-banner" id="hudBanner"></div>

      <button class="recenter-fab following" id="recenterBtn" aria-label="Centralizar veículo">◎</button>

      <div class="map-fabs">
        <button class="fab zoom" id="zoomIn" aria-label="Aproximar">＋</button>
        <div class="fab-divider"></div>
        <button class="fab zoom" id="zoomOut" aria-label="Afastar">－</button>
        <button class="fab" id="fullscreenBtn" aria-label="Tela cheia">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
    </section>

    <!-- ============ MUSIC SCREEN ============ -->
    <section class="screen" id="music-screen">
      <div id="music">
        <div class="cover-wrap" id="coverWrap">
          <div class="cover-art" id="coverArt"></div>
        </div>

        <div class="music-right">
          <div class="track-meta">
            <div class="track-title" id="trackTitle">—</div>
            <div class="track-artist" id="trackArtist">—</div>
            <div class="track-album" id="trackAlbum">—</div>
          </div>

          <div class="progress-row">
            <span class="time" id="timeCurrent">00:00</span>
            <div class="progress-track">
              <div class="progress-bg"></div>
              <div class="progress-fill" id="progressFill"></div>
              <input type="range" class="progress-input" id="progressInput" min="0" max="100" value="0" step="0.1">
            </div>
            <span class="time end" id="timeEnd">00:00</span>
          </div>

          <div class="controls-row">
            <button class="ctrl-btn" id="prevBtn" aria-label="Anterior">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            </button>
            <button class="ctrl-btn play-btn" id="playBtn" aria-label="Reproduzir">
              <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="ctrl-btn" id="nextBtn" aria-label="Próxima">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
            </button>
          </div>

          <div class="mode-tag" id="modeTag">MODO DEMO</div>
        </div>
      </div>
    </section>

  </div>

  <!-- ============ BOTTOM NAV ============ -->
  <nav id="nav">
    <button class="nav-btn active" id="navMap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      MAPA
    </button>
    <button class="nav-btn" id="navMusic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      MÚSICA
    </button>
  </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
(function(){
"use strict";

/* =========================================================================
   NEXUS MID — Central Multimídia (módulo MAPA + MÚSICA)
   Arquivo único: HTML + CSS + JS. Sem build, sem backend, sem dependências
   além do Leaflet via CDN. Rode com: python -m http.server 8080
   ========================================================================= */

/* ------------------------------------------------------------------ *
 * 1) MAPA (Leaflet + OpenStreetMap)
 * ------------------------------------------------------------------ */
const DEFAULT_CENTER = [-22.9068, -43.1729]; // usado só até o 1º fix de GPS
const map = L.map('map', {
  zoomControl: false,
  attributionControl: true,
  center: DEFAULT_CENTER,
  zoom: 16,
  fadeAnimation: true,
  zoomAnimation: true
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map).on('tileerror', function(){
  showBanner('SEM CONEXÃO PARA CARREGAR O MAPA', 3500);
});

// marcador custom do veículo (seta minimalista + glow)
const arrowSvg = `
<svg width="30" height="30" viewBox="0 0 30 30">
  <polygon points="15,3 24,25 15,19.5 6,25" fill="url(#g1)" stroke="#dff6ff" stroke-width="1" stroke-linejoin="round"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fe6ff"/>
      <stop offset="100%" stop-color="#2d8cff"/>
    </linearGradient>
  </defs>
</svg>`;

const vehicleIcon = L.divIcon({
  className: '',
  html: `<div class="vehicle-marker">
           <div class="vehicle-pulse"></div>
           <div class="vehicle-arrow-wrap" id="vehicleArrowWrap">${arrowSvg}</div>
         </div>`,
  iconSize: [46, 46],
  iconAnchor: [23, 23]
});

const vehicleMarker = L.marker(DEFAULT_CENTER, { icon: vehicleIcon, zIndexOffset: 1000 }).addTo(map);
const accuracyCircle = L.circle(DEFAULT_CENTER, {
  radius: 0, color: '#39d0ff', weight: 1, opacity: .35, fillColor: '#39d0ff', fillOpacity: .07
}).addTo(map);

let following = true;
let hasFirstFix = false;
let lastLatLng = null;

function setFollowing(state){
  following = state;
  document.getElementById('recenterBtn').classList.toggle('following', state);
}

map.on('dragstart', function(){ setFollowing(false); });

document.getElementById('recenterBtn').addEventListener('click', function(){
  setFollowing(true);
  if (lastLatLng) map.setView(lastLatLng, Math.max(map.getZoom(), 16), { animate: true });
});

document.getElementById('zoomIn').addEventListener('click', () => map.zoomIn());
document.getElementById('zoomOut').addEventListener('click', () => map.zoomOut());

document.getElementById('fullscreenBtn').addEventListener('click', function(){
  try{
    if (!document.fullscreenElement){
      (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || function(){}).call(document.documentElement);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    }
  }catch(e){ /* Fullscreen indisponível neste navegador — ignora silenciosamente */ }
});

/* ------------------------------------------------------------------ *
 * 2) STATUS / BANNER
 * ------------------------------------------------------------------ */
const gpsDot = document.getElementById('gpsDot');
const gpsText = document.getElementById('gpsText');
let bannerTimer = null;

function setGpsStatus(state, label){
  gpsDot.className = 'gps-dot ' + state;
  gpsText.textContent = label;
}

function showBanner(msg, duration){
  const el = document.getElementById('hudBanner');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => el.classList.remove('show'), duration || 4000);
}

/* ------------------------------------------------------------------ *
 * 3) GEOLOCALIZAÇÃO REAL (navigator.geolocation.watchPosition)
 * ------------------------------------------------------------------ */
const speedValueEl = document.getElementById('speedValue');
let speedBuffer = [];

function updateSpeed(rawSpeedMs){
  const kmh = (typeof rawSpeedMs === 'number' && rawSpeedMs !== null && rawSpeedMs >= 0) ? rawSpeedMs * 3.6 : 0;
  speedBuffer.push(kmh);
  if (speedBuffer.length > 5) speedBuffer.shift();
  const avg = speedBuffer.reduce((a,b) => a + b, 0) / speedBuffer.length;
  speedValueEl.textContent = Math.round(avg);
}

let headingAccum = 0;      // ângulo contínuo (sem "voltar" em 0/360) para permitir transição suave
let hasHeading = false;
const arrowWrap = document.getElementById('vehicleArrowWrap');

function shortestDelta(from, to){
  return ((to - from + 540) % 360) - 180;
}

function updateHeading(rawHeading){
  if (rawHeading === null || typeof rawHeading !== 'number' || isNaN(rawHeading)) return; // mantém último heading válido
  hasHeading = true;
  const delta = shortestDelta(((headingAccum % 360) + 360) % 360, rawHeading);
  headingAccum += delta;
  if (arrowWrap) arrowWrap.style.transform = 'rotate(' + headingAccum + 'deg)';
}

function onPosition(position){
  const c = position.coords;
  lastLatLng = [c.latitude, c.longitude];

  if (!hasFirstFix){
    hasFirstFix = true;
    map.setView(lastLatLng, 17, { animate: false });
  }

  vehicleMarker.setLatLng(lastLatLng);
  accuracyCircle.setLatLng(lastLatLng);
  accuracyCircle.setRadius(c.accuracy || 0);

  if (following) map.panTo(lastLatLng, { animate: true, duration: .5 });

  updateSpeed(c.speed);
  updateHeading(c.heading);

  setGpsStatus('ok', 'GPS CONECTADO');
}

function onPositionError(err){
  switch(err.code){
    case err.PERMISSION_DENIED:
      setGpsStatus('err', 'PERMISSÃO DE LOCALIZAÇÃO NEGADA');
      showBanner('Ative a localização nas permissões do navegador para usar o mapa.', 6000);
      break;
    case err.POSITION_UNAVAILABLE:
      setGpsStatus('err', 'GPS INDISPONÍVEL');
      break;
    case err.TIMEOUT:
      setGpsStatus('wait', 'TENTANDO GPS...');
      break;
    default:
      setGpsStatus('err', 'ERRO DE GPS');
  }
  // velocidade cai para 0 de forma suave quando o sinal se perde
  updateSpeed(null);
}

function startGeolocation(){
  if (!('geolocation' in navigator)){
    setGpsStatus('err', 'GEOLOCALIZAÇÃO NÃO SUPORTADA');
    showBanner('Este navegador não suporta geolocalização.', 5000);
    return;
  }
  setGpsStatus('wait', 'AGUARDANDO GPS...');
  navigator.geolocation.watchPosition(onPosition, onPositionError, {
    enableHighAccuracy: true,
    maximumAge: 1000,
    timeout: 10000
  });
}
startGeolocation();

/* ------------------------------------------------------------------ *
 * 4) NAVEGAÇÃO ENTRE TELAS (MAPA / MÚSICA) + SWIPE
 * ------------------------------------------------------------------ */
const track = document.getElementById('track');
const navMap = document.getElementById('navMap');
const navMusic = document.getElementById('navMusic');
let onMusic = false;

function showMap(){
  onMusic = false;
  track.classList.remove('on-music');
  navMap.classList.add('active');
  navMusic.classList.remove('active');
  setTimeout(() => map.invalidateSize(), 400);
}

function showMusic(){
  onMusic = true;
  track.classList.add('on-music');
  navMusic.classList.add('active');
  navMap.classList.remove('active');
}

navMap.addEventListener('click', showMap);
navMusic.addEventListener('click', showMusic);

// swipe horizontal para alternar telas
let touchStartX = null, touchStartY = null;
document.getElementById('app').addEventListener('touchstart', function(e){
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.getElementById('app').addEventListener('touchend', function(e){
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
    if (dx < 0 && !onMusic) showMusic();
    if (dx > 0 && onMusic) showMap();
  }
  touchStartX = null; touchStartY = null;
}, { passive: true });

/* ------------------------------------------------------------------ *
 * 5) MÓDULO DE MÚSICA
 *
 *    MODO DEMO  -> ativo por padrão, funciona sem qualquer configuração.
 *    MODO SPOTIFY REAL -> estrutura separada abaixo (SpotifyBridge),
 *    NÃO é ativada automaticamente. Ver instruções no final da resposta
 *    para conectar de verdade (Authorization Code + PKCE, sem client_secret
 *    no front-end).
 * ------------------------------------------------------------------ */
const demoPlaylist = [
  { title: 'Rota Noturna',      artist: 'Vetor Azul',        album: 'Sinais',        duration: 214, hue: 200 },
  { title: 'Horizonte Elétrico', artist: 'Cinza Digital',    album: 'Frequências',   duration: 187, hue: 258 },
  { title: 'Estrada Sem Fim',    artist: 'Radar Norte',      album: 'Constelação',   duration: 241, hue: 172 },
  { title: 'Luzes da Cidade',    artist: 'Áudio Solar',      album: 'Órbita',        duration: 198, hue: 320 }
];

let trackIndex = 0;
let currentTime = 0;
let isPlaying = false;
let progressTimer = null;

const el = {
  title: document.getElementById('trackTitle'),
  artist: document.getElementById('trackArtist'),
  album: document.getElementById('trackAlbum'),
  timeCurrent: document.getElementById('timeCurrent'),
  timeEnd: document.getElementById('timeEnd'),
  fill: document.getElementById('progressFill'),
  input: document.getElementById('progressInput'),
  playIcon: document.getElementById('playIcon'),
  coverArt: document.getElementById('coverArt'),
  coverWrap: document.getElementById('coverWrap'),
  modeTag: document.getElementById('modeTag')
};

function fmtTime(s){
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
}

function noteIconSvg(){
  return `<svg viewBox="0 0 24 24" fill="#eaf2ff" opacity="0.92"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" fill="none" stroke="#eaf2ff" stroke-width="1.6"/><circle cx="18" cy="16" r="3" fill="none" stroke="#eaf2ff" stroke-width="1.6"/></svg>`;
}

function renderTrack(){
  const t = demoPlaylist[trackIndex];
  el.title.textContent = t.title;
  el.artist.textContent = t.artist;
  el.album.textContent = t.album;
  el.timeEnd.textContent = fmtTime(t.duration);
  el.timeCurrent.textContent = fmtTime(currentTime);
  el.input.max = t.duration;
  el.coverArt.innerHTML = noteIconSvg();
  el.coverWrap.style.background = `linear-gradient(155deg, hsl(${t.hue},70%,42%) 0%, hsl(${t.hue+40},80%,18%) 65%, #05070d 100%)`;
  updateProgressUI();
}

function updateProgressUI(){
  const t = demoPlaylist[trackIndex];
  const pct = Math.min(100, (currentTime / t.duration) * 100);
  el.fill.style.width = pct + '%';
  el.input.value = currentTime;
  el.timeCurrent.textContent = fmtTime(currentTime);
}

function setPlaying(state){
  isPlaying = state;
  el.playIcon.innerHTML = isPlaying
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  el.coverWrap.classList.toggle('playing', isPlaying);
  clearInterval(progressTimer);
  if (isPlaying){
    progressTimer = setInterval(() => {
      const t = demoPlaylist[trackIndex];
      currentTime += 0.25;
      if (currentTime >= t.duration){
        nextTrack();
        return;
      }
      updateProgressUI();
    }, 250);
  }
}

function loadTrack(i){
  trackIndex = (i + demoPlaylist.length) % demoPlaylist.length;
  currentTime = 0;
  renderTrack();
}

function nextTrack(){ loadTrack(trackIndex + 1); if (isPlaying) setPlaying(true); }
function prevTrack(){
  if (currentTime > 3){ currentTime = 0; updateProgressUI(); return; }
  loadTrack(trackIndex - 1); if (isPlaying) setPlaying(true);
}

document.getElementById('playBtn').addEventListener('click', () => setPlaying(!isPlaying));
document.getElementById('nextBtn').addEventListener('click', nextTrack);
document.getElementById('prevBtn').addEventListener('click', prevTrack);
el.input.addEventListener('input', function(){
  currentTime = parseFloat(el.input.value);
  updateProgressUI();
});

loadTrack(0);
